name: Bug report / 问题反馈
description: Report a reproducible PIDS problem / 反馈可复现的显示或播报问题
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Versions / 版本
      description: Resource pack, Minecraft, loader, MTR, JCM and other relevant mods / 资源包、Minecraft、加载器、MTR、JCM 及相关模组版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include the preset and relevant route/platform settings / 请注明预设及相关线路、站台设置
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual results / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and relevant log excerpts / 截图与相关日志片段
